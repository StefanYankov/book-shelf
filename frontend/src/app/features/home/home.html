<div class="container mt-5">
  <h1>Welcome to the Book Shelf!</h1>
  <p class="text-muted">This is the main dashboard for authenticated users.</p>

  <div class="row mt-4">
    <div class="col-md-6 col-lg-4">
      <a class="text-decoration-none" routerLink="/app/challenges">
        <div class="card shadow-sm border-0 h-100 challenge-card">
          <div class="card-body">
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="fs-4">📚</span>
              <h5 class="card-title fw-bold m-0">Reading Challenge</h5>
            </div>
            <p class="card-text text-muted small mb-3">
              Set and track your {{ year }} reading goal.
            </p>
            <span class="btn btn-outline-primary btn-sm rounded-pill px-3">
              View challenge →
            </span>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
