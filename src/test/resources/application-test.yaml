spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Default cache backend for tests is the in-memory manager. The Redis-specific
  # integration test overrides this to 'redis' and supplies a Redis Testcontainer.
  cache:
    type: simple

  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      # A valid Base64 encoded 256-bit key for testing purposes.
      secret-key: "bXlzdXBlcnNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3NlczEyMzQ1Njc4OTA="
      expiration: 60000
  scheduling:
    enabled: false