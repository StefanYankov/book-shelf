spring:
  application:
    name: book-shelf
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 200
        default-page-size: 20
  cache:
    type: ${CACHE_TYPE:simple}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5p --- [%15.15t] %-40.40logger{39} : %m%n"
  file:
    name: logs/book-shelf.log
  logback:
    rollingpolicy:
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    bg.softuni.bookshelf: INFO
    org.springframework: WARN

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 3600000 # 60 minutes
    auto-seed-admin: false
  scheduling:
    enabled: true

# CORS configuration
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://bookshelf.example.com}
reading-challenge:
  service:
    url: ${READING_CHALLENGE_SERVICE_URL:http://localhost:8081}
cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
