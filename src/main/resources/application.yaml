spring:
  application:
    name: book-shelf
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 200
        default-page-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5p --- [%15.15t] %-40.40logger{39} : %m%n"
  file:
    name: logs/book-shelf.log
  logback:
    rollingpolicy:
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    bg.softuni.bookshelf: INFO
    org.springframework: WARN

application:
  security:
    jwt:
      # This MUST be provided via an environment variable in production
      secret-key: ${JWT_SECRET_KEY}
      expiration: 3600000 # 60 minutes (limits lock-bypass window; see refresh-token note)
    auto-seed-admin: false
  scheduling:
    enabled: true

# CORS configuration
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://bookshelf.example.com}
reading-challenge:
  service:
    url: ${READING_CHALLENGE_SERVICE_URL:http://localhost:8081}