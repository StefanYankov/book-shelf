spring:
  jpa:
    show-sql: true
  docker:
    compose:
      enabled: true
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed

logging:
  level:
    bg.softuni.bookshelf: DEBUG
    org.hibernate.SQL: DEBUG

application:
  security:
    jwt:
      # A default, non-production secret for local development convenience
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    auto-seed-admin: true

# --- localhost origin lives ONLY in the dev profile ---
app:
  cors:
    allowed-origins:
      - http://localhost:4200